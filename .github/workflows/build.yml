name: Build PasteLineCounter

on:
  workflow_dispatch:
  push:
    paths:
      - 'PasteLineCounter.c'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Build EXE
        shell: msys2 {0}
        run: |
          gcc -O2 -s -mwindows -municode -static-libgcc \
            PasteLineCounter.c \
            -o PasteLineCounter.exe \
            -luser32 -lshell32

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path PasteLineCounter.exe -DestinationPath PasteLineCounter-portable.zip

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PasteLineCounter-portable
          path: PasteLineCounter-portable.zip
